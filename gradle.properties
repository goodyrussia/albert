# Allocate 4GB Heap & 1GB Metaspace for D8 Dexing (Fixes mergeExtDexDebug OutOfMemoryError)
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel & Caching optimizations
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Jetifier configuration
android.useAndroidX=true
android.enableJetifier=false
android.jetifier.ignorelist=bcprov,bcpkix,bcutil,bouncycastle
kotlin.code.style=official
android.nonTransitiveRClass=false
